<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영단어</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FB; --sheet:#FFFFFF; --ink:#1B2A4A; --ink2:#55627D; --rule:#D9E1EE;
  --mark:#FFE45C; --markSoft:#FFF4B8; --red:#D93A33; --green:#22895C; --blueline:#B9CBEA;
  --cell:#E4EAF3;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111827; --sheet:#1A2336; --ink:#E8EDF7; --ink2:#9AA7C0; --rule:#2C3854;
    --mark:#E8C93A; --markSoft:#4A4220; --red:#FF6B62; --green:#4FCB8E; --blueline:#2E3D5E;
    --cell:#24304A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111827; --sheet:#1A2336; --ink:#E8EDF7; --ink2:#9AA7C0; --rule:#2C3854;
  --mark:#E8C93A; --markSoft:#4A4220; --red:#FF6B62; --green:#4FCB8E; --blueline:#2E3D5E;
  --cell:#24304A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blueline);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}

header{margin-bottom:22px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:"Gowun Dodum",sans-serif;font-size:15px;color:var(--ink2)}
.daynum{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;margin:6px 0 4px}
.daynum small{font-size:18px;color:var(--ink2);font-weight:500;margin-left:4px}
.iconbtn{background:none;border:0;color:var(--ink2);font-size:13px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:14px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--cell);position:relative}
.cell.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.s3{background:var(--green)}
.cell.s2{background:color-mix(in srgb,var(--green) 60%,var(--cell))}
.cell.s1{background:color-mix(in srgb,var(--mark) 75%,var(--cell))}
.cell.s0{background:color-mix(in srgb,var(--red) 55%,var(--cell))}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}

.bar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:10px}
.bar h2{margin:0;font-size:17px;font-weight:700}
.bar .sub{font-size:13px;color:var(--ink2)}
.toggle{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list{background:var(--sheet);border-radius:14px;border:1px solid var(--rule);overflow:hidden;
  background-image:linear-gradient(to right,transparent 46px,var(--blueline) 46px,var(--blueline) 47px,transparent 47px)}
.row{display:grid;grid-template-columns:46px 1fr auto;align-items:center;border-top:1px solid var(--rule);min-height:68px}
.row:first-child{border-top:0}
.row .n{font-family:Fraunces,serif;font-size:13px;color:var(--ink2);text-align:center}
.row .body{padding:10px 12px 10px 14px;min-width:0}
.word{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:600;line-height:1.2;display:inline;
  background:linear-gradient(transparent 58%,var(--markSoft) 58%)}
.row.review .word{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--red) 22%,transparent) 58%)}
.pos{font-size:12px;color:var(--ink2);margin-left:8px}
.mean{margin-top:2px;font-size:15px;transition:filter .2s}
.hidden .mean{filter:blur(6px);user-select:none}
.hidden .row.show .mean{filter:none}
.ex{display:block;text-align:left;background:none;border:0;padding:4px 0 0;margin:0;font-family:Fraunces,Georgia,serif;font-size:15px;line-height:1.45;color:var(--ink2)}
.ex b{color:var(--ink);font-weight:700}
.ex:active{color:var(--ink)}
.auth{display:grid;gap:12px;margin-top:8px}
.ah{font-family:Fraunces,Georgia,serif;font-size:32px;margin:6px 0 0;line-height:1.15}
.ap{margin:0;color:var(--ink2);font-size:15px}
.field{display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.field input{font:inherit;font-size:17px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 14px;width:100%}
.field input:focus{outline:3px solid var(--blueline);outline-offset:1px;border-color:var(--ink)}
.field input.code{font-family:Fraunces,Georgia,serif;font-size:28px;letter-spacing:.3em;text-align:center}
.auth .secondary{margin-top:0}
.auth .note{margin-top:0;color:var(--red)}
.auth .note.okmsg{color:var(--green)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag.ok{color:var(--green)}
.courses{display:grid;gap:10px;margin-top:18px}
.course{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:16px 18px;display:grid;gap:2px}
.course .ct{font-size:18px;font-weight:700}
.course .cd{font-size:14px;color:var(--ink2)}
.course .cm{font-size:13px;margin-top:6px;color:var(--ink2)}
.course:not(:disabled) .cm{color:var(--ink);font-weight:500}
.course:disabled{opacity:.6;cursor:default}
.course.done{opacity:1}
.course.done .cm{color:var(--green)}
.tag{font-size:11px;color:var(--red);margin-left:8px;font-weight:500}
.say{background:none;border:0;width:44px;height:44px;margin-right:8px;color:var(--ink2);border-radius:50%}
.say svg{width:20px;height:20px}
.say:active{background:var(--cell)}
.sectionlabel{font-size:13px;color:var(--ink2);margin:18px 0 8px}

.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%)}
.dock .in{max-width:560px;margin:0 auto}
.primary{width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:700;background:var(--ink);color:var(--paper)}
.secondary{width:100%;border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:15px;background:var(--sheet);margin-top:10px}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* test */
.progress{height:6px;background:var(--cell);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:20px}
.prompt{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:34px 18px;text-align:center;margin:10px 0 16px}
.prompt .ask{font-size:13px;color:var(--ink2);margin-bottom:10px}
.prompt .big{font-family:Fraunces,Georgia,serif;font-size:38px;font-weight:700;line-height:1.15;word-break:break-word}
.prompt .big.ko{font-family:"Noto Sans KR",sans-serif;font-size:26px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:15px 16px;font-size:17px;display:flex;gap:12px;align-items:center}
.opt .k{font-family:Fraunces,serif;color:var(--ink2);width:18px}
.opt.en{font-family:Fraunces,Georgia,serif;font-size:20px}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--sheet))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--sheet));text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default;color:var(--ink)}

/* result */
.score{text-align:center;margin:26px 0 8px}
.score .num{font-family:Fraunces,Georgia,serif;font-size:84px;font-weight:700;line-height:1;letter-spacing:-.03em}
.score .num span{font-size:34px;color:var(--ink2)}
.score p{margin:10px 0 0;color:var(--ink2);font-size:15px}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink2);margin-top:18px}
.empty{text-align:center;color:var(--ink2);padding:20px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

],["luggage","n","짐, 수하물","Put your luggage here."]],"c1/59":[["period","n","기간, 시대","I lived in Japan for a short period."],["century","n","세기","This church was built in the 18th century."],["age","n","나이","He started playing piano at the age of five."],["date","n","날짜","What's the date today?"],["calendar","n","달력","I marked the date on my calendar."],["birthday","n","생일","Happy birthday to you!"],["anniversary","n","기념일","Today is my parents' wedding anniversary."],["midnight","n","자정","I went to bed after midnight."],["noon","n","정오","Let's meet at noon."],["tonight","ad","오늘 밤","What are you doing tonight?"]],"c1/60":[["lucky","a","운이 좋은","I was lucky to find a seat."],["upset","a","속상한","She was upset about the result."],["serious","a","심각한, 진지한","This is a serious problem."],["unique","a","독특한","Each person has a unique fingerprint."],["similar","a","비슷한","My sister and I have similar tastes."],["whole","a","전체의","I ate the whole cake."],["own","a","자기 자신의","I want my own room."],["certain","a","확실한","I'm certain that he will come."],["various","a","다양한","The store sells various kinds of bread."],["favor","n","부탁, 호의","Can I ask you a favor?"]]}};
const POS={n:'명사',v:'동사',a:'형용사',ad:'부사',prep:'전치사'};
const INT=[1,2,4,7,15,30];      // 단계별 다음 복습까지 간격(학습일 기준)
const MASTER=INT.length;        // 이 단계에 오르면 '완전히 외움'
const NEW_PER_DAY=10, REVIEW_MAX=10;
const LS='vocab.v2', LS_OLD='vocab60.v1', LS_DAY='vocab.day.', LS_COURSES='vocab.courses';
const $app=document.getElementById('app');

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fresh(){return {v:2,course:null,day:1,g:1,status:'pick',review:[],cards:{},history:{},done:[],testedDate:null,attempted:false,updatedAt:0};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let S=fresh(),LSK=LS;
let sb=null,me=null,pendingProfile=false;
let auth={mode:'loading',email:'',name:'',msg:'',busy:false};
let COURSES=EMBED.courses;
const DAYS=Object.assign({},EMBED.days);
let db=null,userDoc=null,ready=false,loadErr='';
let ui={view:null,hide:false,shown:new Set()};
let T=null;

/* ---------- 이전 버전(60일 고정판) 기록 옮기기 ---------- */
function migrate(o){
  const s=fresh();s.course='c1';s.day=o.day||1;s.g=o.day||1;
  s.status=o.status==='tested'?'tested':'study';s.testedDate=o.testedDate||null;s.attempted=!!o.attempted;
  s.history={c1:o.history||{}};
  const last=o.status==='tested'?o.day:o.day-1;
  for(let i=0;i<last*10&&i<600;i++){const w=o.wrong&&o.wrong[i];s.cards['c1:'+i]=w?{lv:0,due:(w.d||1)+1,n:w.n||1}:{lv:1,due:s.g+INT[1],n:0};}
  s.review=[];s.updatedAt=o.updatedAt||0;return s;
}

/* ---------- 단어 데이터 ---------- */
function course(id){return COURSES.find(c=>c.id===id);}
function dayOf(id){const [c,i]=id.split(':');const co=course(c);return [c,Math.floor(+i/(co?co.perDay:10))+1];}
function word(id){const [c,i]=id.split(':');const co=course(c),per=co?co.perDay:10;const d=DAYS[c+'/'+(Math.floor(+i/per)+1)];return d?d[+i%per]:null;}
function newIds(){if(!S.course)return[];const co=course(S.course);if(!co)return[];const s=(S.day-1)*co.perDay;return Array.from({length:co.perDay},(_,k)=>S.course+':'+(s+k)).filter(id=>+id.split(':')[1]<co.count);}
async function loadDay(c,d){
  const key=c+'/'+d;if(DAYS[key])return;
  const cached=lsGet(LS_DAY+key);if(cached){DAYS[key]=cached;return;}
  if(!db)throw new Error('offline');
  const snap=await db.collection('courses/'+c+'/days').doc('d'+String(d).padStart(2,'0')).get();
  if(!snap.exists)throw new Error('missing '+key);
  DAYS[key]=snap.data().words;lsSet(LS_DAY+key,DAYS[key]);
}
async function loadNeeded(){
  const need=new Map();
  const add=id=>{const [c,d]=dayOf(id);need.set(c+'/'+d,[c,d]);};
  newIds().forEach(add);(S.review||[]).forEach(add);
  // 보기(오답 선택지)용으로 같은 과정의 다른 날 단어도 조금 불러옴
  const co=course(S.course)||course((S.review[0]||'').split(':')[0]);
  if(co){for(const d of [Math.max(1,S.day-1),Math.min(co.days,S.day+1),Math.min(co.days,S.day+2)])need.set(co.id+'/'+d,[co.id,d]);}
  await Promise.all([...need.values()].map(([c,d])=>loadDay(c,d)));
}

/* ---------- 간격 반복: 복습 대상 고르기 ---------- */
function pickReview(){
  const fresh=new Set(newIds());
  return Object.entries(S.cards).filter(([id,c])=>c.lv<MASTER&&c.due<=S.g&&!fresh.has(id))
    .sort((a,b)=>a[1].due-b[1].due||a[1].lv-b[1].lv).slice(0,S.reviewMax||REVIEW_MAX).map(([id])=>id);
}
function startDay(){S.status=S.course?'study':(S.status==='pick'?'pick':'study');S.review=pickReview();S.attempted=false;}
function canAdvance(){return S.status==='tested'&&S.testedDate&&today()>S.testedDate;}
function advance(){
  S.g++;
  if(S.course){const co=course(S.course);if(co&&S.day>=co.days){if(!S.done.includes(S.course))S.done.push(S.course);S.course=null;S.day=1;S.status='pick';S.review=pickReview();return;}S.day++;}
  startDay();
}

/* ---------- 저장 ---------- */
let saveTimer=null;
function save(){
  S.updatedAt=Date.now();lsSet(LSK,S);
  if(sb&&me){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,500);}
}

/* ---------- 발음 ---------- */
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}
const SPEAKER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const IRREG={sing:'sang',win:'won',tooth:'teeth',become:'became',lay:'laid',hide:'hid',lose:'lost',feed:'fed',fly:'flew',lead:'led'};
function exHTML(w,s){
  const forms=[w,IRREG[w],w.replace(/e$/,''),w.replace(/y$/,'i')].filter(Boolean).map(f=>f.replace(/[^a-z']/gi,''));
  for(const f of forms){const m=s.match(new RegExp('\\b('+f+'\\w*)','i'));if(m){const k=m.index;return esc(s.slice(0,k))+'<b>'+esc(m[1])+'</b>'+esc(s.slice(k+m[1].length));}}
  return esc(s);
}

/* ---------- 헤더 ---------- */
function stats(){let m=0,l=0;for(const c of Object.values(S.cards)){if(c.lv>=MASTER)m++;else l++;}return {m,l,due:Object.values(S.cards).filter(c=>c.lv<MASTER&&c.due<=S.g).length};}
function header(){
  const co=course(S.course);const st=stats();
  let grid='';
  if(co){
    const h=S.history[co.id]||{};const cells=[];
    for(let d=1;d<=co.days;d++){
      const r=h[d];let c='cell';
      if(r){const x=r.c/r.t;c+=x>=.9?' s3':x>=.7?' s2':x>=.5?' s1':' s0';}
      if(d===S.day&&S.status!=='tested')c+=' now';
      cells.push(`<div class="${c}" title="Day ${d}${r?` ${r.c}/${r.t}`:''}"></div>`);
    }
    grid=`<div class="grid" aria-label="진행 현황">${cells.join('')}</div>`;
  }
  return `<header>
    <div class="top"><span class="brand">${co?esc(co.title):'영단어'}</span><button class="iconbtn" data-act="menu">메뉴</button></div>
    <div class="daynum">${co?`Day ${S.day}<small>/ ${co.days}</small>`:'복습'}</div>
    ${grid}
    <div class="legend"><span>외운 단어 ${st.m}개</span><span>익히는 중 ${st.l}개</span></div>
  </header>`;
}

/* ---------- 학습 화면 ---------- */
function rowHTML(id,n,isReview){
  const w=word(id);if(!w)return'';const [en,p,m,ex]=w;const c=S.cards[id];
  const tag=isReview&&c?(c.lv===0?'<span class="tag">지난번에 틀림</span>':`<span class="tag ok">${c.lv}단계 복습</span>`):'';
  return `<div class="row${isReview?' review':''}${ui.shown.has(id)?' show':''}" data-id="${id}">
    <div class="n">${n}</div>
    <div class="body"><span class="word">${esc(en)}</span><span class="pos">${POS[p]||''}</span>${tag}
      <div class="mean">${esc(m)}</div>
      ${ex?`<button class="ex" data-say="${esc(ex)}" aria-label="예문 듣기">${exHTML(en,ex)}</button>`:''}</div>
    <button class="say" data-say="${esc(en)}" aria-label="${esc(en)} 발음 듣기">${SPEAKER}</button>
  </div>`;
}
function viewStudy(){
  const nw=newIds(),rv=S.review||[];let n=0;
  if(!nw.length&&!rv.length){
    $app.innerHTML=header()+`<div class="note" style="margin-top:28px">오늘은 복습할 단어가 없어요. 새 과정을 고르면 새 단어를 이어서 외울 수 있어요.</div>
    <div style="margin-top:16px"><button class="primary" data-act="pick">과정 고르기</button></div>`;return;
  }
  $app.innerHTML=header()+`
  <div class="bar"><div><h2>오늘 외울 단어</h2><div class="sub">${nw.length?`새 단어 ${nw.length}개`:''}${nw.length&&rv.length?', ':''}${rv.length?`복습 ${rv.length}개`:''}</div></div>
    <button class="toggle" data-act="hide" aria-pressed="${ui.hide}">뜻 가리기</button></div>
  <div class="${ui.hide?'hidden':''}">
    ${nw.length?`<div class="list">${nw.map(id=>rowHTML(id,++n,false)).join('')}</div>`:''}

}

/* ---------- 시험 ---------- */
function parts(m){return m.replace(/[()]/g,',').split(',').map(s=>s.trim()).filter(Boolean);}
function clash(a,b){const pa=parts(a[2]),pb=new Set(parts(b[2]));return a[0]===b[0]||pa.some(x=>pb.has(x));}
function pool(){const out=[];for(const k in DAYS)for(const w of DAYS[k])out.push(w);return out;}
function distractors(w){
  const P=pool().filter(x=>!clash(w,x));
  const cand=shuffle(P.filter(x=>x[1]===w[1])).concat(shuffle(P.filter(x=>x[1]!==w[1])));
  const out=[];for(const x of cand){if(out.every(o=>!clash(o,x)))out.push(x);if(out.length===3)break;}
  return out;
}
function buildTest(){
  const ids=shuffle(newIds().concat(S.review||[])).filter(id=>word(id));
  T={qs:ids.map(id=>{const w=word(id);return {id,w,dir:Math.random()<.5?'en':'ko',opts:shuffle([w,...distractors(w)]),pick:null};}),k:0,first:!S.attempted};
}
function viewTest(){
  const q=T.qs[T.k],[en,,m]=q.w,answered=q.pick!==null;
  $app.innerHTML=`<header><div class="top"><span class="brand">${S.course?`Day ${S.day} 시험`:'복습 시험'}</span><button class="iconbtn" data-act="quit">그만두기</button></div>
  <div class="progress"><i style="width:${T.k/T.qs.length*100}%"></i></div></header>
  <div class="qmeta"><span>${T.k+1} / ${T.qs.length}</span><span>${(S.review||[]).includes(q.id)?'복습 단어':''}</span></div>
  <div class="prompt"><div class="ask">${q.dir==='en'?'알맞은 뜻을 고르세요':'알맞은 영단어를 고르세요'}</div>
    <div class="big ${q.dir==='ko'?'ko':''}">${esc(q.dir==='en'?en:m)}</div></div>
  <div class="opts">${q.opts.map((o,j)=>{
    let c='opt'+(q.dir==='ko'?' en':'');
    if(answered){if(o===q.w)c+=' right';else if(o===q.pick)c+=' wrong';}
    return `<button class="${c}" data-opt="${j}" ${answered?'disabled':''}><span class="k">${j+1}</span>${esc(q.dir==='en'?o[2]:o[0])}</button>`;
  }).join('')}</div>
  ${answered&&q.pick!==q.w?`<div class="note">${q.w[3]?exHTML(q.w[0],q.w[3]):''}</div><div class="dock"><div class="in"><button class="primary" data-act="next">${T.k+1<T.qs.length?'다음 문제':'결과 보기'}</button></div></div>`:''}`;
}
function answer(j){const q=T.qs[T.k];if(q.pick!==null)return;q.pick=q.opts[j];if(q.dir==='ko')speak(q.w[0]);viewTest();if(q.pick===q.w)setTimeout(next,650);}
function next(){if(!T)return;if(T.k+1<T.qs.length){T.k++;viewTest();}else finishTest();}
function finishTest(){
  const wrong=T.qs.filter(q=>q.pick!==q.w),c=T.qs.length-wrong.length;
  if(T.first){
    for(const q of T.qs){
      const card=S.cards[q.id];
      if(q.pick!==q.w)S.cards[q.id]={lv:0,due:S.g+INT[0],n:(card?card.n:0)+1};
      else{const lv=card?card.lv+1:1;S.cards[q.id]={lv,due:lv>=MASTER?null:S.g+INT[lv],n:card?card.n:0};}
    }
    if(S.course){S.history[S.course]=S.history[S.course]||{};S.history[S.course][S.day]={c,t:T.qs.length,date:today()};}
    S.attempted=true;S.status='tested';S.testedDate=today();save();
  }
  ui.last={c,t:T.qs.length,wrong:wrong.map(q=>q.id),first:T.first};T=null;ui.view='result';render();
}

/* ---------- 결과 ---------- */
function viewResult(){
  const L=ui.last||(()=>{const h=S.course&&S.history[S.course]&&S.history[S.course][S.day];return h?{c:h.c,t:h.t,wrong:null,first:true}:{c:0,t:0,wrong:null,first:true};})();
  const r=L.t?L.c/L.t:0;
  const msg=r===1?'전부 맞혔어요.':r>=.8?'거의 다 외웠어요.':r>=.5?'틀린 단어는 다음 날 다시 나와요.':'오늘 단어를 한 번 더 보고 다시 풀어보세요.';
  const co=course(S.course),last=co&&S.day>=co.days;
  const nextLabel=!S.course?'다음 복습':last?'다음 과정 고르기':`Day ${S.day+1}`;
  $app.innerHTML=header()+`
  <div class="score"><div class="num">${L.c}<span> / ${L.t}</span></div><p>${msg}</p></div>
  ${L.wrong&&L.wrong.length?`<div class="sectionlabel">틀린 단어</div><div class="list">${L.wrong.map((id,n)=>rowHTML(id,n+1,false)).join('')}</div>`:''}
  ${!L.first?`<div class="note">연습 시험이에요. 기록은 오늘 첫 시험 결과로 남아 있어요.</div>`:''}
  <div class="note">${last?`${esc(co.title)} 과정을 마쳤어요. 다음 과정을 고르면 이어서 공부할 수 있고, 이 과정 단어도 복습에 계속 나와요.`:`${nextLabel}은 내일 열려요.`}</div>
  <div style="margin-top:18px">
    <button class="primary" data-act="advance">${last?'다음 과정 고르기':`기다리지 않고 ${nextLabel} 시작`}</button>
    <button class="secondary" data-act="restudy">오늘 단어 다시 보기</button>
    <button class="secondary" data-act="retest">다시 시험 보기 (연습)</button>
  </div>`;
}

/* ---------- 라우팅 ---------- */
function render(){
  window.scrollTo(0,0);
  if(!me)return viewAuth();
  if(!ready){$app.innerHTML=loadErr?`<div class="note" style="margin-top:40px">${esc(loadErr)}</div>`:'<div class="empty" style="margin-top:40vh">불러오는 중</div>';return;}
  if(ui.view==='menu')return viewMenu();
  if(ui.view==='pick'||S.status==='pick')return viewPick();
  if(ui.view==='test'&&T)return viewTest();
  if(ui.view==='result'||(S.status==='tested'&&ui.view!=='study'))return viewResult();
  return viewStudy();
}
async function go(fn){ready=false;render();try{fn&&fn();await loadNeeded();ready=true;}catch(e){loadErr='단어를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어주세요.';}render();}

$app.addEventListener('click',e=>{
  const say=e.target.closest('[data-say]');if(say){speak(say.dataset.say);return;}
  const opt=e.target.closest('[data-opt]');if(opt){answer(+opt.dataset.opt);return;}
  const cb=e.target.closest('[data-course]');
  if(cb){const id=cb.dataset.course;if(S.course!==id){S.course=id;S.day=1;}ui.view=null;go(()=>{startDay();save();});return;}
  const rm=e.target.closest('[data-rmax]');if(rm){S.reviewMax=+rm.dataset.rmax;save();viewMenu();return;}
  const b=e.target.closest('[data-act]');
  if(b){
    const a=b.dataset.act;
    if(a==='hide'){ui.hide=!ui.hide;ui.shown.clear();viewStudy();}
    else if(a==='test'||a==='retest'){buildTest();ui.view='test';render();}
    else if(a==='next')next();
    else if(a==='quit'){if(confirm('시험을 그만둘까요? 지금까지 푼 답은 저장되지 않아요.')){T=null;ui.view=S.status==='tested'?'result':'study';render();}}
    else if(a==='restudy'){ui.view='study';ui.hide=false;render();}
    else if(a==='advance'){ui.view=null;ui.last=null;ui.shown.clear();go(()=>{advance();save();});}
    else if(a==='menu'){ui.view='menu';render();}
    else if(a==='pick'){ui.view='pick';render();}
    else if(a==='back'){ui.view=null;render();}
    else if(a==='reviewonly'){S.status='study';ui.view=null;go(()=>{startDay();save();});}
    else if(a==='logout'){logout();}
    else if(a.startsWith('a-')){authAct(a);}
    else if(a==='reset'){if(confirm('모든 기록을 지우고 처음부터 시작할까요?')){S=fresh();save();ui={view:null,hide:false,shown:new Set()};render();}}
    return;
  }
  const row=e.target.closest('.hidden .row');
  if(row){const id=row.dataset.id;ui.shown.has(id)?ui.shown.delete(id):ui.shown.add(id);row.classList.toggle('show');}
});
document.addEventListener('keydown',e=>{
  if(ui.view!=='test'||!T)return;const q=T.qs[T.k];
  if(q.pick===null&&/^[1-4]$/.test(e.key))answer(+e.key-1);else if(q.pick!==null&&e.key==='Enter')next();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready&&ui.view!=='test'&&canAdvance()){ui.view=null;ui.last=null;go(()=>{advance();save();});}});

/* ---------- 계정: 이메일 인증 → 가입 → 로그인 ---------- */
const NAME_RE=/^[A-Za-z][A-Za-z .'-]{0,39}$/;
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function errKo(e){
  const m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m))return '이메일 또는 비밀번호가 맞지 않아요.';
  if(/expired|invalid.*(otp|token)|Token has expired/i.test(m))return '인증번호가 틀렸거나 만료됐어요. 다시 받아서 입력해 주세요.';
  if(/rate limit|security purposes|seconds/i.test(m))return '요청이 너무 잦아요. 1분쯤 뒤에 다시 시도해 주세요.';
  if(/Password should be/i.test(m))return '비밀번호는 6자 이상이어야 해요.';
  if(/Failed to fetch|NetworkError/i.test(m))return '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  return m;
}
function viewAuth(){
  const a=auth,dis=a.busy?'disabled':'';
  const msg=a.msg?`<div class="note${a.ok?' okmsg':''}">${esc(a.msg)}</div>`:'';
  let body='';
  if(a.mode==='loading')body='<div class="empty" style="margin-top:30vh">불러오는 중</div>';
  else if(a.mode==='config')body=msg;
  else if(a.mode==='login')body=`
    <h2 class="ah">로그인</h2>
    <label class="field">이메일<input id="f-email" type="email" autocomplete="email" inputmode="email" value="${esc(a.email)}"></label>
    <label class="field">비밀번호<input id="f-pw" type="password" autocomplete="current-password"></label>
    ${msg}
    <button class="primary" data-act="a-login" ${dis}>로그인</button>
    <button class="secondary" data-act="a-go-signup">이메일로 가입하기</button>
    <button class="linkbtn" data-act="a-go-reset">비밀번호를 잊었어요</button>`;
  else if(a.mode==='email')body=`
    <h2 class="ah">${a.reset?'비밀번호 재설정':'가입하기'}</h2>
    <p class="ap">이메일로 인증번호를 보내드려요.</p>
    <label class="field">이메일<input id="f-email" type="email" autocomplete="email" inputmode="email" value="${esc(a.email)}"></label>
    ${msg}
    <button class="primary" data-act="a-send" ${dis}>인증번호 받기</button>
    <button class="linkbtn" data-act="a-go-login">로그인으로 돌아가기</button>`;
  else if(a.mode==='code')body=`
    <h2 class="ah">인증번호 입력</h2>
    <p class="ap">${esc(a.email)}로 보낸 번호를 입력하세요. 메일이 안 보이면 스팸함도 확인해 주세요.</p>
    <label class="field">인증번호<input id="f-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" class="code"></label>
    ${msg}
    <button class="primary" data-act="a-verify" ${dis}>확인</button>
    <button class="secondary" data-act="a-send" ${dis}>번호 다시 보내기</button>
    <button class="linkbtn" data-act="a-go-login">처음으로</button>`;
  else if(a.mode==='profile')body=`
    <h2 class="ah">${a.name?'새 비밀번호 설정':'거의 다 됐어요'}</h2>
    <p class="ap">${esc(a.email)} 인증이 끝났어요.</p>
    <label class="field">영어 이름<input id="f-name" autocomplete="name" placeholder="예: Haechang Lee" value="${esc(a.name)}"></label>
    <label class="field">비밀번호 (6자 이상)<input id="f-pw" type="password" autocomplete="new-password"></label>
    <label class="field">비밀번호 확인<input id="f-pw2" type="password" autocomplete="new-password"></label>
    ${msg}
    <button class="primary" data-act="a-profile" ${dis}>${a.name?'저장하고 시작하기':'가입 완료'}</button>`;
  $app.innerHTML=`<header><div class="top"><span class="brand">영단어</span></div></header><div class="auth">${body}</div>`;
  const first=$app.querySelector('input');if(first&&!first.value)first.focus();
}
async function authAct(act){
  const a=auth;a.msg='';a.ok=false;
  // 화면을 다시 그리기 전에 입력값을 먼저 읽어둔다
  const pwEl=document.getElementById('f-pw'),pw2El=document.getElementById('f-pw2');
  const F={email:val('f-email'),code:val('f-code'),name:val('f-name'),pw:pwEl?pwEl.value:'',pw2:pw2El?pw2El.value:''};
  const busy=async fn=>{a.busy=true;viewAuth();try{await fn();}catch(e){a.msg=errKo(e);}a.busy=false;if(!me)viewAuth();};
  if(act==='a-go-signup'){a.mode='email';a.reset=false;a.email=F.email||a.email;return viewAuth();}
  if(act==='a-go-reset'){a.mode='email';a.reset=true;a.email=F.email||a.email;return viewAuth();}
  if(act==='a-go-login'){a.mode='login';pendingProfile=false;return viewAuth();}
  if(act==='a-login')return busy(async()=>{
    const email=F.email,password=F.pw;a.email=email;
    if(!EMAIL_RE.test(email)||!password){a.msg='이메일과 비밀번호를 입력해 주세요.';return;}
    const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
    await enter(data.user);
  });
  if(act==='a-send')return busy(async()=>{
    const email=a.mode==='code'?a.email:F.email;a.email=email;
    if(!EMAIL_RE.test(email)){a.msg='이메일 주소를 확인해 주세요.';return;}
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;
    const resent=a.mode==='code';a.mode='code';if(resent){a.msg='인증번호를 다시 보냈어요.';a.ok=true;}
  });
  if(act==='a-verify')return busy(async()=>{
    const token=F.code.replace(/\s/g,'');
    if(!/^\d{6,10}$/.test(token)){a.msg='메일로 받은 숫자를 입력해 주세요.';return;}
    pendingProfile=true;
    const {data,error}=await sb.auth.verifyOtp({email:a.email,token,type:'email'});
    if(error){pendingProfile=false;throw error;}
    a.name=(data.user.user_metadata&&data.user.user_metadata.name)||'';a.mode='profile';
  });
  if(act==='a-profile')return busy(async()=>{
    const name=F.name,pw=F.pw,pw2=F.pw2;a.name=name;
    if(!NAME_RE.test(name)){a.msg='영어 이름은 영문 알파벳과 공백으로 입력해 주세요.';return;}
    if(pw.length<6){a.msg='비밀번호는 6자 이상이어야 해요.';return;}
    if(pw!==pw2){a.msg='비밀번호 두 개가 서로 달라요.';return;}
    const {data,error}=await sb.auth.updateUser({password:pw,data:{name}});if(error)throw error;
    pendingProfile=false;await enter(data.user);
  });
}
$app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  const btn=$app.querySelector('.auth .primary');if(btn&&!btn.disabled)btn.click();
});

/* ---------- 로그인 후: 이전 기록 불러오기 ---------- */
async function enter(user){
  me={id:user.id,email:user.email,name:(user.user_metadata&&user.user_metadata.name)||''};
  LSK=LS+'.'+me.id;
  let local=lsGet(LSK);
  let remote=null;
  try{
    const {data,error}=await sb.from('progress').select('state').eq('user_id',me.id).maybeSingle();
    if(!error&&data)remote=data.state;
  }catch(e){}
  S=Object.assign(fresh(),(remote&&(!local||(remote.updatedAt||0)>=(local.updatedAt||0)))?remote:(local||{}));
  lsSet(LSK,S);
  if(!remote&&local&&local.updatedAt)pushRemote();
  ui={view:null,hide:false,shown:new Set()};
  await go(()=>{if(canAdvance())advance();else if(S.status!=='pick'&&!S.review.length&&!S.attempted)S.review=pickReview();save();});
}
async function pushRemote(){
  if(!sb||!me)return;
  try{await sb.from('progress').upsert({user_id:me.id,name:me.name,state:S,updated_at:new Date(S.updatedAt||Date.now()).toISOString()});}catch(e){}
}
async function logout(){
  if(!confirm('로그아웃할까요?'))return;
  clearTimeout(saveTimer);await pushRemote();
  await sb.auth.signOut();me=null;S=fresh();ready=false;LSK=LS;
  auth={mode:'login',email:'',name:'',msg:'',busy:false};render();
}

(async()=>{
  if(SUPABASE_URL.includes('YOUR-PROJECT')||!window.supabase){
    auth.mode='config';auth.msg='index.html 맨 위의 SUPABASE_URL과 SUPABASE_ANON_KEY를 내 Supabase 프로젝트 값으로 바꿔야 해요.';render();return;
  }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_OUT'&&me){me=null;ready=false;auth.mode='login';render();}
  });
  const {data:{session}}=await sb.auth.getSession();
  if(session&&session.user&&session.user.user_metadata&&session.user.user_metadata.name)await enter(session.user);
  else{auth.mode='login';render();}
})();
</script></body></html>
